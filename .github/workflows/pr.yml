name: PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-gate:
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/quality-gate
